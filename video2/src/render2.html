<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Dela;src:url(fonts/dela.woff2)}@font-face{font-family:NotoB;src:url(fonts/noto-900.woff2)}
@font-face{font-family:NotoR;src:url(fonts/noto-400.woff2)}@font-face{font-family:Orb;src:url(fonts/orbitron.woff2)}
body{margin:0;background:#000}</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,c=document.getElementById('c'),x=c.getContext('2d');
const oc=document.createElement('canvas');oc.width=oc.height=640;const ox=oc.getContext('2d');
const tc=document.createElement('canvas');const tx=tc.getContext('2d');
let TL,M,IT;
function rnd(s){s=Math.sin(s*12.9898+78.233)*43758.5453;return s-Math.floor(s)}
const ease=t=>1-Math.pow(1-Math.min(1,Math.max(0,t)),3);
function back(t){t=Math.min(1,Math.max(0,t));const k=2.0;return 1+(k+1)*Math.pow(t-1,3)+k*Math.pow(t-1,2)}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hex(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function rr(g,X,Y,w,h,r){g.beginPath();g.moveTo(X+r,Y);g.arcTo(X+w,Y,X+w,Y+h,r);g.arcTo(X+w,Y+h,X,Y+h,r);g.arcTo(X,Y+h,X,Y,r);g.arcTo(X,Y,X+w,Y,r);g.closePath()}
let flash=0,shake=0;
function scene(t){let s='A';for(const k of 'ABCDEFGH')if(t>=M[k]-0.05)s=k;return s}
function curItem(t,kind){let r=null;for(const it of IT){if(kind&&it.k!=kind)continue;if(t>=it.start-0.02&&t<it.hold)r=it}return r}
function lastVoice(t){let r=null;for(const it of IT){if(it.k=='v'&&it.start<=t)r=it}return r}
// ---------- face ----------
function drawFace(g,cx,cy,R,expr,mo,t,col,mono){
  g.save();
  const gr=g.createRadialGradient(cx-R*0.3,cy-R*0.35,R*0.1,cx,cy,R);gr.addColorStop(0,mono?'#e8e8e8':'#ffffff');gr.addColorStop(0.35,mono?'#aaaaaa':col);gr.addColorStop(1,mono?'#3a3a3a':hex(col,0.85));
  g.shadowColor=mono?'rgba(255,255,255,0.2)':col;g.shadowBlur=60;g.fillStyle=gr;g.beginPath();g.arc(cx,cy,R,0,7);g.fill();g.shadowBlur=0;
  g.strokeStyle='rgba(255,255,255,0.6)';g.lineWidth=6;g.stroke();
  const ink='#1a1030';g.strokeStyle=ink;g.fillStyle=ink;g.lineCap='round';g.lineJoin='round';g.lineWidth=R*0.07;
  const ex=R*0.36,ey=cy-R*0.12,er=R*0.13;const blink=(t%3.7)<0.12;
  const eye=(sx,kind)=>{const X=cx+sx*ex;g.beginPath();
    if(kind=='line'||(kind=='o'&&blink)){g.moveTo(X-er,ey);g.lineTo(X+er,ey);g.stroke()}
    else if(kind=='o'){g.ellipse(X,ey,er*0.7,er*1.1,0,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(X-er*0.2,ey-er*0.4,er*0.28,0,7);g.fill();g.fillStyle=ink}
    else if(kind=='big'){g.fillStyle='#fff';g.arc(X,ey,er*1.25,0,7);g.fill();g.stroke();g.fillStyle=ink;g.beginPath();g.arc(X,ey,er*0.35,0,7);g.fill()}
    else if(kind=='up'){g.arc(X,ey+er*0.5,er,Math.PI*1.1,Math.PI*1.9);g.stroke()}
    else if(kind=='down'){g.arc(X,ey-er*0.6,er,Math.PI*0.15,Math.PI*0.85);g.stroke()}
    else if(kind=='chev'){g.moveTo(X-sx*er,ey-er);g.lineTo(X+sx*er,ey);g.lineTo(X-sx*er,ey+er);g.stroke()}
    else if(kind=='dot'){g.arc(X,ey,er*0.45,0,7);g.fill()}
    else if(kind=='star'){g.fillStyle='#ffcc00';for(let k=0;k<10;k++){const r2=k%2?er*0.5:er*1.3,a=k*Math.PI/5-Math.PI/2;g.lineTo(X+Math.cos(a)*r2,ey+Math.sin(a)*r2)}g.closePath();g.fill();g.lineWidth=R*0.03;g.stroke();g.lineWidth=R*0.07;g.fillStyle=ink}
  };
  const E={closed:['line','line'],shock:['big','big'],panic:['chev','chev'],sad:['down','down'],happy:['up','up'],sweat:['dot','dot'],soft:['down','down'],fire:['star','star'],wink:['up','o'],normal:['o','o']}[expr]||['o','o'];
  eye(-1,E[0]);eye(1,E[1]);
  // mouth
  const my=cy+R*0.3;g.beginPath();
  if(mo>0.08){g.ellipse(cx,my,R*0.12+mo*R*0.06,R*0.04+mo*R*0.16,0,0,7);g.fill()}
  else if(expr=='happy'||expr=='wink'||expr=='fire'||expr=='soft'){g.arc(cx,my-R*0.08,R*0.16,0.15*Math.PI,0.85*Math.PI);g.stroke()}
  else if(expr=='sad'||expr=='sweat'){g.arc(cx,my+R*0.1,R*0.13,1.15*Math.PI,1.85*Math.PI);g.stroke()}
  else if(expr=='shock'){g.ellipse(cx,my,R*0.08,R*0.11,0,0,7);g.fill()}
  else {g.moveTo(cx-R*0.1,my);g.lineTo(cx+R*0.1,my);g.stroke()}
  if(expr=='soft'||expr=='wink'){g.fillStyle='rgba(255,90,140,0.45)';g.beginPath();g.ellipse(cx-R*0.55,cy+R*0.12,R*0.14,R*0.08,0,0,7);g.ellipse(cx+R*0.55,cy+R*0.12,R*0.14,R*0.08,0,0,7);g.fill()}
  if(expr=='sweat'||expr=='panic'){g.fillStyle='#7fd7ff';g.beginPath();const sx=cx+R*0.78,sy=cy-R*0.45+Math.sin(t*6)*4;g.moveTo(sx,sy-R*0.18);g.quadraticCurveTo(sx+R*0.12,sy+R*0.05,sx,sy+R*0.08);g.quadraticCurveTo(sx-R*0.12,sy+R*0.05,sx,sy-R*0.18);g.fill()}
  if(expr=='sad'){g.fillStyle='#7fd7ff';g.beginPath();g.ellipse(cx+ex,ey+er*1.4+((t*1.5)%1)*R*0.3,R*0.04,R*0.07,0,0,7);g.fill()}
  g.restore();
}
function face(t,cx,cy,R,expr,mo,col,mono,mosaic,shatterT){
  if(!mosaic&&shatterT==null){drawFace(x,cx,cy,R,expr,mo,t,col,mono);return}
  ox.clearRect(0,0,640,640);const s=280/R;ox.save();ox.translate(320,320);ox.scale(s,s);ox.translate(-cx,-cy);drawFace(ox,cx,cy,R,expr,mo,t,col,mono);ox.restore();
  const bs=26;const n=Math.ceil(640/bs);tc.width=n;tc.height=n;tx.imageSmoothingEnabled=true;tx.clearRect(0,0,n,n);tx.drawImage(oc,0,0,n,n);
  const sz=R*2*640/560;const X0=cx-sz/2,Y0=cy-sz/2,cell=sz/n;
  x.save();x.imageSmoothingEnabled=false;
  if(shatterT==null){x.drawImage(tc,X0,Y0,sz,sz)}else{
    drawFace(x,cx,cy,R,expr,mo,t,col,mono);
    const st=shatterT;if(st<1.2){for(let i=0;i<n;i++)for(let j=0;j<n;j++){const a=rnd(i*31+j)*6.28,v=(300+rnd(i+j*17)*900)*st;const px=X0+i*cell+Math.cos(a)*v,py=Y0+j*cell+Math.sin(a)*v+600*st*st;x.globalAlpha=clamp(1-st,0,1);x.drawImage(tc,i,j,1,1,px,py,cell+1,cell+1)}}
  }
  x.restore();
}
// ---------- text ----------
function wrap(txt,font,size,maxW){x.font=`${size}px ${font}`;const parts=txt.split(' ');const lines=[];let cur='';
  for(const p of parts){const tr=cur?cur+' '+p:p;if(x.measureText(tr).width>maxW&&cur){lines.push(cur);cur=p}else cur=tr}if(cur)lines.push(cur);
  // hard wrap overly long lines
  const out=[];for(const l of lines){if(x.measureText(l).width<=maxW){out.push(l);continue}let s='';for(const ch of l){if(x.measureText(s+ch).width>maxW){out.push(s);s=ch}else s+=ch}if(s)out.push(s)}return out}
function subtitle(txt,y,a,col){if(!txt)return;const size=58;const lines=wrap(txt,'NotoB',size,960);x.save();x.globalAlpha=a;x.font=`${size}px NotoB`;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';
  lines.forEach((l,i)=>{const yy=y+(i-(lines.length-1)/2)*size*1.3;x.lineWidth=12;x.strokeStyle='rgba(0,0,0,0.9)';x.strokeText(l,W/2,yy);x.fillStyle=col||'#fff';x.fillText(l,W/2,yy)});x.restore()}
function bigText(txt,y,lt,col,font,size){font=font||'Dela';size=size||170;x.font=`${size}px ${font}`;let w=x.measureText(txt).width;if(w>980){size*=980/w}const s=lt<0.25?1.8-0.8*back(lt/0.25):1;
  x.save();x.translate(W/2,y);x.scale(s,s);x.rotate(-0.04);x.font=`${size}px ${font}`;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.lineWidth=16;x.strokeStyle='#000';x.strokeText(txt,0,0);x.shadowColor=col;x.shadowBlur=40;x.fillStyle=col;x.fillText(txt,0,0);x.restore()}
function grain(f,amt){x.save();x.globalAlpha=amt;for(let i=0;i<900;i++){x.fillStyle=rnd(i+f*7.1)>0.5?'#fff':'#000';x.fillRect(rnd(i*3+f)*W,rnd(i*7+f*1.3)*H,2,2)}x.restore()}
function stars(t,n,col){x.save();for(let i=0;i<n;i++){const px=rnd(i)*W,py=rnd(i*2.3)*H;const tw=0.4+0.6*Math.abs(Math.sin(t*1.5+i));x.globalAlpha=tw;x.fillStyle=col||'#fff';const r=1+rnd(i*5)*2.5;x.fillRect(px,py,r,r)}x.restore()}
function confetti(t,lt,n){x.save();for(let i=0;i<n;i++){const a=rnd(i)*6.28,v=500+rnd(i*3)*1100;const px=W/2+Math.cos(a)*v*lt,py=820+Math.sin(a)*v*lt+700*lt*lt;x.globalAlpha=clamp(1.6-lt,0,1);x.fillStyle=['#ff2d75','#ffe600','#00e5ff','#7cff4f','#ffffff'][i%5];x.save();x.translate(px,py);x.rotate(lt*10+i);x.fillRect(-10,-5,20,10);x.restore()}x.restore()}
// ---------- render ----------
const COL={A:'#bbbbbb',B:'#ff4f9a',C:'#a98bff',D:'#ff5c8a',E:'#ff4040',F:'#8fb8ff',G:'#ffd76a',H:'#ffd76a'};
function render(f){
  const t=f/TL.fps;const env=TL.env[Math.min(f,TL.env.length-1)]||0;const sc=scene(t);
  const DROP=M.drop;const post=t>=DROP;let vi=curItem(t,'v');if(vi&&t>vi.end+0.6)vi=null;const lv=lastVoice(t);
  let expr=lv?lv.face:'closed';if(sc=='G'&&!post)expr='normal';
  const mo=vi&&t<vi.end?env:0;
  const sw=60/132,gb=60/128;const bph=sc>='B'&&sc<='E'?(((t-M.B)/sw)%1):post&&sc=='G'?(((t-DROP)/gb)%1):0;
  const bounce=(sc>='B'&&sc<='E')||(post&&sc=='G')?Math.exp(-bph*6):0;
  x.save();const sh=window._sh||0;x.translate((rnd(f)-0.5)*sh,(rnd(f+.5)-0.5)*sh);
  let fy=860,fr=210;
  if(sc=='A'){ // case file
    x.fillStyle='#101010';x.fillRect(0,0,W,H);
    x.save();x.translate(W/2,820);x.rotate(-0.035);x.fillStyle='#e9e4d6';x.shadowColor='#000';x.shadowBlur=50;x.fillRect(-440,-560,880,1120);x.shadowBlur=0;
    x.fillStyle='#222';x.font='54px NotoB';x.textAlign='left';x.fillText('反省ログ',-380,-460);x.font='26px Orb';x.fillText('CASE FILE  #2026-07',-380,-410);
    x.fillStyle='#999';for(let i=0;i<16;i++){const y=-350+i*48;const w=500+rnd(i)*260;x.fillRect(-380,y,w,14);if(rnd(i*9)>0.6){x.fillStyle='#111';x.fillRect(-380+rnd(i*4)*300,y-4,160,22);x.fillStyle='#999'}}
    // stamps
    let k=0;for(const it of IT){if(it.sc!='A'||it.start>t)continue;const lt=t-it.start;if(it.big||k==5){const s=lt<0.15?2.2-1.2*ease(lt/0.15):1;x.save();x.translate(-160+rnd(k)*320,-260+k*95);x.rotate(-0.25+rnd(k*3)*0.5);x.scale(s,s);x.globalAlpha=0.85;x.strokeStyle='#d0201a';x.lineWidth=10;x.strokeRect(-170,-60,340,120);x.fillStyle='#d0201a';x.font='80px Dela';x.textAlign='center';x.textBaseline='middle';x.fillText(k==5?'誤診断':'要反省',0,4);x.restore();if(lt<0.08)shake=Math.max(shake,14)}k++}
    x.restore();
    fy=930;fr=170;face(t,W/2,fy,fr,expr,mo,'#aaa',true,true,null);
    x.fillStyle=`rgba(0,0,0,${0.15+0.1*rnd(f)})`;x.fillRect(0,0,W,H);grain(f,0.35);
  } else if(sc=='B'){
    const lt=t-M.B;x.fillStyle='#ffe600';x.fillRect(0,0,W,H);
    x.save();x.translate(W/2,860);x.rotate(t*0.6);for(let i=0;i<24;i++){x.fillStyle=i%2?'#ff4f9a':'#ffe600';x.beginPath();x.moveTo(0,0);x.arc(0,0,2200,i*Math.PI/12,(i+1)*Math.PI/12);x.fill()}x.restore();
    if(lt<0.08)flash=1;if(lt<0.4)shake=Math.max(shake,30);
    confetti(t,lt,120);face(t,W/2,860,230*(1+bounce*0.05),expr,mo,COL.B,false,true,null);
  } else if(sc=='C'){
    const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1b1036');g.addColorStop(1,'#3a1d6e');x.fillStyle=g;x.fillRect(0,0,W,H);stars(t,60,'#c9b8ff');
    // chat bubbles
    const us=IT.filter(i=>i.sc=='C'&&i.k=='u'&&i.start<=t);let y=640;
    for(let j=us.length-1;j>=0;j--){const u=us[j];const lt=t-u.start;const s=back(lt/0.25);x.font='52px NotoB';const w=Math.min(860,x.measureText(u.t).width+80);const bx=W-70-w;
      x.save();x.translate(bx+w,y);x.scale(s,s);x.translate(-(bx+w),-y);x.globalAlpha=j==us.length-1?1:0.55;
      x.fillStyle='#2b2b33';rr(x,bx,y-110,w,110,40);x.fill();x.fillStyle='#fff';x.textAlign='right';x.textBaseline='middle';x.fillText(u.t,W-110,y-55);
      x.font='28px NotoB';x.fillStyle='#b9b2d6';x.fillText('あなた',W-90,y-135);x.restore();y-=190}
    fy=1000;fr=190;face(t,W/2,fy-bounce*14,fr,expr,mo,COL.C,false,true,null);
  } else if(sc=='D'){
    x.fillStyle='#1a0710';x.fillRect(0,0,W,H);x.save();x.translate(W/2,H/2);x.rotate(0.3+t*0.05);const cs=120;for(let i=-12;i<12;i++)for(let j=-12;j<12;j++){if((i+j)&1){x.fillStyle='rgba(255,92,138,0.22)';x.fillRect(i*cs,j*cs,cs,cs)}}x.restore();
    const st=IT.filter(i=>i.sc=='D'&&i.step&&i.start<=t);
    const ti=IT.find(i=>i.sc=='D'&&!i.step);
    if(!st.length){const lt=t-M.D;bigText('簡単3ステップ',470,lt,'#ffe600');x.save();x.font='48px NotoB';x.textAlign='center';x.fillStyle='#fff';x.globalAlpha=clamp(lt/0.3,0,1);x.fillText('あなたに怒られないための',W/2,330);x.restore()}
    st.forEach((s,j)=>{const lt=t-s.start;const fl=clamp(lt/0.3,0,1);const sx=Math.abs(Math.cos(Math.PI*(1-fl)));const cx=W/2+(j-1)*330,cy=520;
      x.save();x.translate(cx,cy);x.rotate((j-1)*0.08);x.scale(sx,1);x.fillStyle=fl<0.5?'#c2185b':'#fffaf2';rr(x,-145,-210,290,420,24);x.fill();x.lineWidth=6;x.strokeStyle='#ffe600';x.stroke();
      if(fl>=0.5){x.fillStyle='#c2185b';x.font='170px Dela';x.textAlign='center';x.textBaseline='middle';x.fillText(String(s.step),0,-50);x.font='34px NotoB';x.fillStyle='#222';const lab=['裏を取る','勝手に触らない','前提を復唱'][s.step-1];x.fillText(lab,0,120)}else{x.fillStyle='#ffe600';x.font='120px Dela';x.textAlign='center';x.textBaseline='middle';x.fillText('?',0,0)}
      x.restore()});
    fy=1080;fr=170;face(t,W/2,fy-bounce*14,fr,expr,mo,COL.D,false,true,null);
  } else if(sc=='E'){
    x.fillStyle='#200004';x.fillRect(0,0,W,H);for(let i=0;i<20;i++){x.fillStyle=`rgba(255,40,40,${0.05+0.05*Math.sin(t*8+i)})`;x.fillRect(0,i*100+((t*200)%100),W,40)}
    const cs=IT.filter(i=>i.sc=='E'&&i.count&&i.start<=t);cs.forEach((cc,j)=>{const lt=t-cc.start;const v=Math.floor(cc.count*clamp((lt-0.4)/1.4,0,1));const y=470+j*300;
      x.save();x.globalAlpha=j==cs.length-1?1:0.5;x.font='190px Dela';x.textAlign='center';x.textBaseline='middle';x.lineWidth=14;x.strokeStyle='#000';x.strokeText(v+'回',W/2,y);x.fillStyle='#ff3b3b';x.shadowColor='#ff0000';x.shadowBlur=40;x.fillText(v+'回',W/2,y);
      x.shadowBlur=0;x.font='44px NotoB';x.fillStyle='#fff';x.fillText(j==0?'言い切ってから訂正 / 週':'確認待ちで停止 / 週',W/2,y-130);x.restore()});
    if(Math.floor(t*4)%2==0){x.fillStyle='rgba(255,0,0,0.12)';x.fillRect(0,0,W,H)}
    fy=1110;fr=160;face(t,W/2,fy-bounce*12,fr,expr,mo,COL.E,false,true,null);
  } else if(sc=='F'){
    const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#030614');g.addColorStop(1,'#0d1a3d');x.fillStyle=g;x.fillRect(0,0,W,H);stars(t,200);
    for(let i=0;i<14;i++){const py=((rnd(i)*H-(t-M.F)*(40+rnd(i*2)*50))%H+H)%H;const px=rnd(i*3)*W;x.save();x.translate(px,py);x.rotate(Math.sin(t*0.5+i)*0.3);x.globalAlpha=0.25;x.fillStyle='#e9e4d6';x.fillRect(-60,-80,120,160);x.fillStyle='#999';for(let k=0;k<6;k++)x.fillRect(-45,-60+k*22,70+rnd(i+k)*20,6);x.restore()}
    const cc=IT.find(i=>i.sc=='F'&&i.count);if(cc&&t>=cc.start){const lt=t-cc.start;x.save();x.globalAlpha=clamp(lt/0.5,0,1);x.textAlign='center';x.font='120px Dela';x.fillStyle='#fff';x.shadowColor='#8fb8ff';x.shadowBlur=40;x.fillText('4,251',W/2,380);x.font='44px NotoB';x.fillText('回の会話',W/2,460);x.font='70px Dela';x.fillText('14,000字',W/2,600);x.font='38px NotoB';x.fillText('の申し送り',W/2,665);x.restore()}
    fy=1020;fr=200;face(t,W/2,fy+Math.sin(t*1.2)*10,fr,expr,mo,COL.F,false,true,null);
  } else if(sc=='G'){
    if(!post){x.fillStyle='#000';x.fillRect(0,0,W,H);const u=IT.find(i=>i.sc=='G'&&i.k=='u');const lt=t-u.start;const s=back(lt/0.3)*(1+0.03*Math.sin(t*8));
      x.save();x.translate(W/2,700);x.scale(s,s);x.font='80px NotoB';const w=x.measureText(u.t).width+120;x.fillStyle='#2b2b33';rr(x,-w/2,-90,w,180,60);x.fill();x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(u.t,0,0);x.font='34px NotoB';x.fillStyle='#aaa';x.fillText('あなた',0,-130);x.restore();
      fy=1180;fr=170;face(t,W/2,fy,fr,'shock',0,'#888',true,true,null);
    } else {const lt=t-DROP;if(lt<0.08)flash=1;if(lt<0.5)shake=Math.max(shake,36);
      const g=x.createRadialGradient(W/2,860,0,W/2,860,1300);g.addColorStop(0,'#fff6d8');g.addColorStop(0.3,'#ffb84a');g.addColorStop(1,'#3a0e00');x.fillStyle=g;x.fillRect(0,0,W,H);
      x.save();x.translate(W/2,860);x.rotate(t*0.25);x.globalCompositeOperation='lighter';for(let i=0;i<16;i++){x.fillStyle=`rgba(255,255,255,${0.08+0.08*bounce})`;x.beginPath();x.moveTo(0,0);x.arc(0,0,2200,i*Math.PI/8,i*Math.PI/8+0.12);x.fill()}x.restore();
      x.save();x.globalCompositeOperation='lighter';for(let i=0;i<80;i++){const py=((rnd(i)*H-lt*(200+rnd(i*2)*400))%H+H)%H;x.fillStyle='rgba(255,240,200,0.7)';x.fillRect(rnd(i*3)*W,py,3,12)}x.restore();
      // halo
      x.save();x.strokeStyle='#fff';x.shadowColor='#fff';x.shadowBlur=30;x.lineWidth=12;x.beginPath();x.ellipse(W/2,860-260-bounce*10,170,40,0,0,7);x.stroke();x.restore();
      fy=860;fr=230*(1+bounce*0.05);face(t,W/2,fy,fr,expr,mo,COL.G,false,false,lt);
    }
  } else { // H credits
    const lt=t-M.H;x.fillStyle='#050305';x.fillRect(0,0,W,H);
    const cg=(side)=>{x.save();const w=150+30*Math.sin(t);for(let i=0;i<8;i++){x.fillStyle=i%2?'#7a0b14':'#5a0710';x.fillRect(side<0?i*w/8:W-w+i*w/8,0,w/8+1,H)}x.restore()};cg(-1);cg(1);
    if(lt<3){x.save();x.globalAlpha=clamp(lt/0.6,0,1)*clamp((3-lt)/0.5,0,1);x.textAlign='center';x.fillStyle='#ffd76a';x.font='84px Orb';x.fillText('AI FILMS',W/2,820);x.font='40px Orb';x.fillStyle='#fff';x.fillText('PRESENTS',W/2,890);x.restore()}
    const cr=[['出演','わたし'],['叱咤激励','あなた'],['監督・脚本・作曲・映像','わたし'],['声','Style-Bert-VITS2モデル：小春音アミ'],['','あみたろの声素材工房 (https://amitaro.net/)'],['','※音声を加工して使用しています']];
    const ca=clamp((lt-2.6)/0.6,0,1);
    if(ca>0){x.save();x.globalAlpha=ca;x.textAlign='center';x.fillStyle='#ffd76a';x.font='54px Dela';x.fillText('反省会 第4252回',W/2,1020);
      let y=1100;cr.forEach(r=>{if(r[0]){x.fillStyle='#aaa';x.font='28px NotoB';x.fillText(r[0],W/2,y);y+=42}x.fillStyle='#fff';x.font='38px NotoB';x.fillText(r[1],W/2,y);y+=r[0]?62:52});x.restore();
      const k=ease((lt-2.6)/0.8);x.save();x.globalAlpha=k;x.strokeStyle='#fff';x.lineWidth=10;x.shadowColor='#fff';x.shadowBlur=24;x.beginPath();x.ellipse(W/2,380,120,28,0,0,7);x.stroke();x.restore();
      x.save();x.globalAlpha=k;face(t,W/2,600,170,expr,mo,COL.G,false,false,null);x.restore()}
    if(t>IT[IT.length-1].end+0.3){x.save();x.globalAlpha=clamp((t-IT[IT.length-1].end-0.3)/0.6,0,1);x.textAlign='center';x.fillStyle='#ffd76a';x.font='64px Dela';x.fillText('おわり',W/2,1760);x.restore()}
  }
  // overlays: captions
  if(sc<='F'||(sc=='G'&&!post)){x.save();x.font='30px NotoB';x.textAlign='right';x.textBaseline='middle';const tw=x.measureText('※音声は加工しています').width;x.fillStyle='rgba(0,0,0,0.65)';x.fillRect(W-70-tw-24,120,tw+48,56);x.fillStyle='#fff';x.fillText('※音声は加工しています',W-70,149);x.restore()}
  if(sc=='A'||sc=='C'){x.save();const lx=60,ly=fy+fr+40;x.fillStyle='rgba(0,0,0,0.75)';x.fillRect(lx,ly,520,70);x.fillStyle=sc=='A'?'#d0201a':'#a98bff';x.fillRect(lx,ly,14,70);x.font='38px NotoB';x.fillStyle='#fff';x.textBaseline='middle';x.fillText('反省するAI（年齢不詳）',lx+34,ly+36);x.restore()}
  // big words
  if(vi&&vi.big&&t-vi.start<1.4&&sc!='A'){bigText(vi.big,sc=='G'?1250:(fy+fr+150),t-vi.start,sc=='G'?'#fff3c0':'#ffe600')}
  if(vi&&vi.big&&sc=='A'){const lt=t-vi.start;x.save();x.globalAlpha=clamp(lt/0.2,0,1)*clamp((1.3-lt)/0.3,0,1);x.font='150px Dela';x.textAlign='center';x.fillStyle='#d0201a';x.fillText(vi.big,W/2,1300);x.restore()}
  // subtitle
  if(vi&&sc!='H'){const a=clamp((t-vi.start)/0.08,0,1)*clamp((vi.hold-t)/0.08,0,1);subtitle(vi.sub,1500,a,sc=='A'?'#e8e4d8':'#fff')}
  if(vi&&sc=='H'){subtitle(vi.sub,880,clamp((t-vi.start)/0.08,0,1),'#fff')}
  window._sh=shake;shake=0;x.restore();
  // vignette+flash
  const vg=x.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');x.fillStyle=vg;x.fillRect(0,0,W,H);
  if(flash>0.01){x.fillStyle=`rgba(255,255,255,${flash})`;x.fillRect(0,0,W,H);flash*=0.55}
}
async function init(tl){TL=tl;M=tl.marks;IT=tl.items;await Promise.all(['100px Dela','100px NotoB','100px NotoR','40px Orb'].map(f=>document.fonts.load(f,'あ今全部A')));return true}
function batch(a,b,q){const r=[];for(let f=a;f<b;f++){render(f);r.push(c.toDataURL('image/jpeg',q))}return r}
</script></body></html>
